# Self-hosting example. Copy it to docker-compose.yml, then adapt it:
#   cp docker-compose.example.yml docker-compose.yml
#   cp backend/example/config.example.yaml config.yaml   # and edit it with your hosts
#   docker compose up -d                                  # http://localhost:8080
services:
  backend:
    image: ghcr.io/matthieusb/uptime-city-backend:latest # pin a version, e.g. :0.1.0
    restart: unless-stopped
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - uptime-data:/app/data # SQLite history, when storage.type is sqlite
    # Lets the non-root user send ICMP pings (icmp:// checks).
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    # environment:
    #   SIMULATION_MODE: "true" # fake the statuses instead of probing anything

  frontend:
    image: ghcr.io/matthieusb/uptime-city-frontend:latest # same version as the backend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:8080"

volumes:
  uptime-data:
