name: Release

# Manual: Actions tab > Release > Run workflow, then pick the bump.
# Tags the latest commit of main, publishes the Docker images, then creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.next.outputs.sha }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compute the next version
        id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            # First release: 0.1.0, or 1.0.0 when a major is asked.
            if [ "$BUMP" = major ]; then next=1.0.0; else next=0.1.0; fi
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Latest tag: ${latest:-none}, next version: v$next"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Refuse to release a commit whose checks failed
        run: |
          failed=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ steps.next.outputs.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed check(s) failed on ${{ steps.next.outputs.sha }}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # Emulates arm64 so that the runner (amd64) can build it.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.part }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }},enable=${{ !startsWith(needs.version.outputs.version, '0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.part }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,scope=${{ matrix.part }},mode=max

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Creates the tag on the released commit together with the release.
      - name: Create the tag and the release
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Docker images: \`ghcr.io/$GITHUB_REPOSITORY-backend:$VERSION\` and \`ghcr.io/$GITHUB_REPOSITORY-frontend:$VERSION\`."
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
